<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KATEPEDIA</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
    <div class="logo">KATEPEDIA</div>

    <div class="search-box">
        <input type="text" placeholder="Cari produk...">
        <button>Cari</button>
    </div>

    <div class="cart-icon" onclick="toggleCart()">
        🛒 <span id="cart-count">0</span>
    </div>
</header>

<!-- CART PANEL -->
<div class="cart" id="cart">
    <h3>Keranjang</h3>
    <ul id="cart-list"></ul>
    <div class="cart-footer">
        <p>Total: <span>Rp <span id="total">0</span></span></p>
        <button onclick="checkout()">Checkout</button>
    </div>
</div>

<!-- SLIDER -->
<section class="slider">
    <img src="images/slide-1.jpg">
</section>

<h2 class="title">Produk Populer</h2>

<!-- PRODUK -->
<section class="products">

    <div class="card">
        <img src="images/images.jfif">
        <div class="card-body">
            <h4>Joki MLBB</h4>
            <p>Rp 5.000</p>
            <button onclick="addCart('Joki MLBB',5000)">+ Keranjang</button>
        </div>
    </div>

    <div class="card">
        <img src="images/Gemini_Generated_Image_mu3jhbmu3jhbmu3j.png">
        <div class="card-body">
            <h4>Necro Hax</h4>
            <p>Rp 15.000</p>
            <button onclick="addCart('Necro Hax',15000)">+ Keranjang</button>
        </div>
    </div>

    <div class="card">
        <img src="images/ff.png">
        <div class="card-body">
            <h4>Top Up Free Fire</h4>
            <p>Rp 10.000</p>
            <button onclick="addCart('Free Fire',10000)">+ Keranjang</button>
        </div>
    </div>

</section>

<!-- SCRIPT -->
<script>
let cart = [];
let total = 0;

function toggleCart(){
    document.getElementById("cart").classList.toggle("show");
}

function addCart(nama,harga){
    cart.push({nama,harga});
    total += harga;
    renderCart();
}

function renderCart(){
    let list = document.getElementById("cart-list");
    list.innerHTML = "";

    cart.forEach((item,i)=>{
        list.innerHTML += `
        <li>
            ${item.nama}
            <span>Rp ${item.harga}</span>
            <button onclick="removeItem(${i})">x</button>
        </li>`;
    });

    document.getElementById("total").innerText = total;
    document.getElementById("cart-count").innerText = cart.length;
}

function removeItem(i){
    total -= cart[i].harga;
    cart.splice(i,1);
    renderCart();
}

function checkout(){
    let text = "Halo saya mau order:%0A%0A";
    cart.forEach(item=>{
        text += "- "+item.nama+" Rp "+item.harga+"%0A";
    });
    text += "%0ATotal: Rp "+total;

    window.open("https://wa.me/6288808529621?text="+text);
}
</script>

</body>
</html>
